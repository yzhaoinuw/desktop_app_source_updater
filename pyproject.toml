[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-app-source-updater"
version = "0.3.0"
description = "Code-only source updater for Python desktop apps with stable launchers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yue Zhao" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "pyinstaller",
    "auto-update",
    "updater",
    "desktop-app",
    "github-releases",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yzhaoinuw/desktop_app_source_updater"
Repository = "https://github.com/yzhaoinuw/desktop_app_source_updater"
Documentation = "https://github.com/yzhaoinuw/desktop_app_source_updater#readme"
Issues = "https://github.com/yzhaoinuw/desktop_app_source_updater/issues"

[project.scripts]
desktop-app-source-update-asset = "desktop_app_source_updater.build_update_asset:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop_app_source_updater*"]
