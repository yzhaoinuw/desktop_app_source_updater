name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Verifies the Python versions and the OS Independent classifier that
    # pyproject.toml advertises on the PyPI page.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Byte-compile the package
        run: python -m compileall -q desktop_app_source_updater

      - name: Check the asset builder entry point
        run: python -m desktop_app_source_updater.build_update_asset --help

  package:
    # Catches metadata regressions before a release rather than at upload time,
    # when a PyPI version number has already been spent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
